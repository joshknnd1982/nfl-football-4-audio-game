# NFL Football 4 clone. This is inspired by Jim Kitchen.
[project]
name = "nfl4-clone"
version = "0.1.0"
description = "NFL Football 4, an audio football game for blind players. This is inspired by Jim Kitchen."
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# faulthandler prints a "fatal exception" for every SEH exception, even ones a speech engine
# raises and handles itself (FlexVoice does, code 0xe0000002, on pitch markup; Brain S7.1).
addopts = "-p no:faulthandler"
markers = [
    "sapi: uses the real SAPI 5 engine (silent, volume 0)",
    "nvda: loads the real NVDA controller DLL (never speaks)",
    "window: creates a hidden Win32 window",
    "mixer: uses the real pygame mixer on SDL's silent dummy driver",
]
